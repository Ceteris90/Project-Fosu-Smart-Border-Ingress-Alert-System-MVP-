services:
  project-fosu:
    build:
      context: .
      dockerfile: 1-app-source-code/Dockerfile
    image: project-fosu:local
    container_name: project-fosu
    env_file:
      - path: .env
        format: raw
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - fosu-data:/data
    restart: unless-stopped

  yolo-sensor:
    build:
      context: .
      dockerfile: 1-app-source-code/Dockerfile
    image: project-fosu:local
    container_name: project-fosu-yolo-sensor
    depends_on:
      - project-fosu
    command:
      - python
      - 1-app-source-code/scripts/yolo_sensor.py
      - --api-url
      - http://project-fosu:8000/ingest
      - --config
      - 1-app-source-code/scripts/cameras.example.json
    restart: unless-stopped

volumes:
  fosu-data:
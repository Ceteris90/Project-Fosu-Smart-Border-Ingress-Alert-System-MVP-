# Requires Docker Compose v2.24+ (for `env_file: format: raw`).
services:
  project-fosu:
    build:
      context: .
      dockerfile: 1-app-source-code/Dockerfile
    image: project-fosu:local
    container_name: project-fosu
    env_file:
      - path: .env
        format: raw
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - fosu-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/", timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  yolo-sensor:
    build:
      context: .
      dockerfile: 1-app-source-code/Dockerfile
    image: project-fosu:local
    container_name: project-fosu-yolo-sensor
    depends_on:
      project-fosu:
        condition: service_healthy
    command:
      - python
      - 1-app-source-code/scripts/yolo_sensor.py
      - --api-url
      - http://project-fosu:8000/ingest
      - --config
      - 1-app-source-code/scripts/cameras.example.json
    restart: unless-stopped

volumes:
  fosu-data:
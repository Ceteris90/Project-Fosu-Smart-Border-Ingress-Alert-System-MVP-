apiVersion: apps/v1
kind: Deployment
metadata:
  name: fosu-api
  namespace: "{{ fosu_namespace }}"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fosu-api
  template:
    metadata:
      labels:
        app: fosu-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        project-fosu/workload: application
      containers:
        - name: api
          image: "{{ image }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["uvicorn"]
          args: ["--app-dir", "1-app-source-code", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "30"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: fosu-app-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fosu-api
  namespace: "{{ fosu_namespace }}"
spec:
  type: ClusterIP
  selector:
    app: fosu-api
  ports:
    - name: http
      port: 8000
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fosu-yolo-sensor
  namespace: "{{ fosu_namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fosu-yolo-sensor
  template:
    metadata:
      labels:
        app: fosu-yolo-sensor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        project-fosu/workload: application
      containers:
        - name: yolo-sensor
          image: "{{ image }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["python"]
          args:
            - 1-app-source-code/scripts/yolo_sensor.py
            - --api-url
            - http://fosu-api:8000/ingest
            - --config
            - 1-app-source-code/scripts/cameras.example.json
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi

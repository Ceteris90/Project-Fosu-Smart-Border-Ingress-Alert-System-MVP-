apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fosu-dashboard
  namespace: project-fosu
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    appgw.ingress.kubernetes.io/health-probe-path: /_stcore/health
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: dashboard-tls
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: "{{ dashboard_hostname }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fosu-dashboard
                port:
                  number: 8501

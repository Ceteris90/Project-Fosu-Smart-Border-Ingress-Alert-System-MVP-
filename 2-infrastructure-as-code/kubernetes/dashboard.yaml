apiVersion: apps/v1
kind: Deployment
metadata:
  name: fosu-dashboard
  namespace: "{{ fosu_namespace }}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fosu-dashboard
  template:
    metadata:
      labels:
        app: fosu-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        project-fosu/workload: application
      containers:
        - name: dashboard
          image: "{{ image }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["streamlit"]
          args: ["run", "1-app-source-code/dashboard/dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: API_BASE
              value: "http://fosu-api:8000"
          envFrom:
            - secretRef:
                name: fosu-app-secrets
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fosu-dashboard
  namespace: "{{ fosu_namespace }}"
spec:
  type: ClusterIP
  selector:
    app: fosu-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http

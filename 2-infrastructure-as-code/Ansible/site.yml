---
- name: Configure Project Fosu on private AKS
  hosts: aks_control
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../../.venv/bin/python"
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default('/tmp/project-fosu-kubeconfig', true) }}"
    terraform_dir: "{{ playbook_dir }}/../Terraform"
    image_repository: "ceteris90/project-fosu"
    manifest_files:
      - api.yaml
      - dashboard.yaml
      - yolo-sensor.yaml
      - api-network-policy.yaml
      - yolo-sensor-network-policy.yaml
      - dashboard-ingress.yaml

  pre_tasks:
    - name: Apply deployment defaults when not set by inventory or extra vars
      ansible.builtin.set_fact:
        fosu_namespace: "{{ fosu_namespace | default('project-fosu', true) }}"
        image_tag: "{{ image_tag | default('latest', true) }}"
        kubernetes_manifest_dir: "{{ kubernetes_manifest_dir | default(playbook_dir ~ '/../kubernetes', true) }}"

    - name: Ensure the Terraform working directory is initialized
      ansible.builtin.command:
        cmd: terraform init -input=false -no-color
        chdir: "{{ terraform_dir }}"
        creates: "{{ terraform_dir }}/.terraform"
      changed_when: false

    - name: Read Terraform outputs
      ansible.builtin.command:
        argv:
          - terraform
          - output
          - -json
        chdir: "{{ terraform_dir }}"
      register: terraform_output
      changed_when: false
      no_log: true

    - name: Set infrastructure variables from Terraform outputs
      ansible.builtin.set_fact:
        terraform_outputs: "{{ terraform_output.stdout | from_json }}"
        azure_resource_group: "{{ (terraform_output.stdout | from_json).resource_group_name.value }}"
        aks_cluster_name: "{{ (terraform_output.stdout | from_json).aks_cluster_name.value }}"
        image: "{{ image_repository }}:{{ image_tag | default('latest') }}"
        dashboard_hostname: "{{ (terraform_output.stdout | from_json).dashboard_hostname.value }}"
        postgres_private_fqdn: "{{ (terraform_output.stdout | from_json).postgres_private_fqdn.value }}"

    - name: Require protected application variables
      ansible.builtin.assert:
        that:
          - image is defined
          - image is not search('REPLACE_')
        fail_msg: "Set a valid deployment image before running the playbook."

    - name: Require Azure CLI and kubectl
      ansible.builtin.command: "{{ item.command }}"
      changed_when: false
      loop:
        - command: az --version
        - command: kubectl version --client
        - command: kubelogin --version

    - name: Read PostgreSQL administrator username
      ansible.builtin.command:
        argv:
          - az
          - postgres
          - flexible-server
          - show
          - --resource-group
          - "{{ azure_resource_group }}"
          - --name
          - "{{ postgres_private_fqdn.split('.')[0] }}"
          - --query
          - administratorLogin
          - --output
          - tsv
      register: postgres_admin_username
      changed_when: false

    - name: Find application Key Vault
      ansible.builtin.command:
        argv:
          - az
          - keyvault
          - list
          - --resource-group
          - "{{ azure_resource_group }}"
          - --query
          - "[0].name"
          - --output
          - tsv
      register: application_key_vault
      changed_when: false

    - name: Read dashboard username from Key Vault
      ansible.builtin.command:
        argv:
          - az
          - keyvault
          - secret
          - show
          - --vault-name
          - "{{ application_key_vault.stdout | trim }}"
          - --name
          - dashboard-username
          - --query
          - value
          - --output
          - tsv
      register: dashboard_username_secret
      changed_when: false
      no_log: true

    - name: Read dashboard password hash from Key Vault
      ansible.builtin.command:
        argv:
          - az
          - keyvault
          - secret
          - show
          - --vault-name
          - "{{ application_key_vault.stdout | trim }}"
          - --name
          - dashboard-password-hash
          - --query
          - value
          - --output
          - tsv
      register: dashboard_password_hash_secret
      changed_when: false
      no_log: true

    - name: Set dashboard credentials from Key Vault
      ansible.builtin.set_fact:
        dashboard_username: "{{ dashboard_username_secret.stdout | trim }}"
        dashboard_password_hash: "{{ dashboard_password_hash_secret.stdout | trim }}"
      no_log: true

    - name: Read PostgreSQL password from Key Vault
      ansible.builtin.command:
        argv:
          - az
          - keyvault
          - secret
          - show
          - --vault-name
          - "{{ application_key_vault.stdout | trim }}"
          - --name
          - postgres-admin-password
          - --query
          - value
          - --output
          - tsv
      register: postgres_admin_password
      changed_when: false
      no_log: true

    - name: Build private PostgreSQL connection URL
      ansible.builtin.set_fact:
        database_url: >-
          postgresql+psycopg2://{{ postgres_admin_username.stdout | trim | urlencode }}:{{ postgres_admin_password.stdout | trim | urlencode }}@{{ postgres_private_fqdn }}:5432/fosu?sslmode=require
      no_log: true

    - name: Read private AKS endpoint metadata
      ansible.builtin.command:
        argv:
          - az
          - aks
          - show
          - --resource-group
          - "{{ azure_resource_group }}"
          - --name
          - "{{ aks_cluster_name }}"
          - --query
          - "{node_resource_group:nodeResourceGroup,private_fqdn:privateFqdn}"
          - --output
          - json
      register: aks_endpoint_metadata
      changed_when: false

    - name: Set private AKS endpoint variables
      ansible.builtin.set_fact:
        aks_node_resource_group: "{{ (aks_endpoint_metadata.stdout | from_json).node_resource_group }}"
        aks_private_fqdn: "{{ (aks_endpoint_metadata.stdout | from_json).private_fqdn }}"
        aks_private_record_name: "{{ ((aks_endpoint_metadata.stdout | from_json).private_fqdn).split('.')[0] }}"
        aks_private_zone_name: "{{ ((aks_endpoint_metadata.stdout | from_json).private_fqdn).split('.')[1:] | join('.') }}"

    - name: Resolve private AKS API address from Azure DNS
      ansible.builtin.command:
        argv:
          - az
          - network
          - private-dns
          - record-set
          - a
          - show
          - --resource-group
          - "{{ aks_node_resource_group }}"
          - --zone-name
          - "{{ aks_private_zone_name }}"
          - --name
          - "{{ aks_private_record_name }}"
          - --query
          - "aRecords[0].ipv4Address"
          - --output
          - tsv
      register: aks_private_ip
      changed_when: false

    - name: Check route to private AKS API
      ansible.builtin.command:
        argv:
          - ip
          - route
          - get
          - "{{ aks_private_ip.stdout | trim }}"
      register: aks_private_route
      changed_when: false

    - name: Require private AKS traffic to use the VPN tunnel
      ansible.builtin.assert:
        that:
          - aks_private_route.stdout is regex(' dev (tun|tap)[^ ]* ')
        fail_msg: >-
          Private AKS traffic is not using a VPN tunnel: {{ aks_private_route.stdout | trim }}.
          Start OpenVPN and wait for "Initialization Sequence Completed" before running Ansible.

    - name: Check private AKS TCP connectivity
      ansible.builtin.wait_for:
        host: "{{ aks_private_ip.stdout | trim }}"
        port: 443
        connect_timeout: 5
        timeout: 15
        state: started
        msg: >-
          The VPN route exists, but the private AKS API is not reachable on TCP 443.
          Refresh the Azure VPN profile and reconnect before retrying Ansible.

  tasks:
    - name: Get private AKS credentials
      ansible.builtin.command:
        argv:
          - az
          - aks
          - get-credentials
          - --resource-group
          - "{{ azure_resource_group }}"
          - --name
          - "{{ aks_cluster_name }}"
          - --file
          - "{{ kubeconfig_path }}"
          - --overwrite-existing
      changed_when: true
      no_log: true

    - name: Configure kubeconfig to use the existing Azure CLI login
      ansible.builtin.command:
        argv:
          - kubelogin
          - convert-kubeconfig
          - -l
          - azurecli
          - --kubeconfig
          - "{{ kubeconfig_path }}"
      changed_when: true
      no_log: true

    - name: Configure kubeconfig for private API routing
      ansible.builtin.command:
        argv:
          - kubectl
          - config
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - set-cluster
          - "{{ aks_cluster_name }}"
          - "--server=https://{{ aks_private_ip.stdout | trim }}:443"
          - "--tls-server-name={{ aks_private_fqdn }}"
      changed_when: true

    - name: Check private AKS API connectivity
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - get
          - namespace
      changed_when: false

    - name: Create application namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ fosu_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: restricted

    - name: Create private application Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: fosu-app-secrets
            namespace: "{{ fosu_namespace }}"
          type: Opaque
          stringData:
            DATABASE_URL: "{{ database_url }}"
            FOSU_DASHBOARD_USERNAME: "{{ dashboard_username }}"
            FOSU_DASHBOARD_PASSWORD_HASH: "{{ dashboard_password_hash }}"
      no_log: true

    - name: Render image and hostname into manifests
      ansible.builtin.template:
        src: "{{ kubernetes_manifest_dir }}/{{ item }}"
        dest: "/tmp/project-fosu-{{ item }}"
        mode: "0600"
      loop: "{{ manifest_files }}"
      vars:
        acr_image: "{{ image }}"
      register: rendered_manifests

    - name: Apply workload manifests
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ item.dest }}"
      loop: "{{ rendered_manifests.results }}"

    - name: Roll Deployments when the image tag is mutable
      # A re-pushed ":latest" leaves the manifest unchanged, so "kubectl apply"
      # is a no-op and no new pods are created. Force a rollout in that case.
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --namespace
          - "{{ fosu_namespace }}"
          - rollout
          - restart
          - deployment/fosu-api
          - deployment/fosu-dashboard
          - deployment/fosu-yolo-sensor
      when: image_tag == 'latest'
      changed_when: true

    - name: Wait for rolled Deployments to finish updating
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --namespace
          - "{{ fosu_namespace }}"
          - rollout
          - status
          - "deployment/{{ item }}"
          - --timeout=600s
      loop:
        - fosu-api
        - fosu-dashboard
      when: image_tag == 'latest'
      changed_when: false

    - name: Wait for API deployment
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ fosu_namespace }}"
        name: fosu-api
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 600

    - name: Wait for dashboard deployment
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ fosu_namespace }}"
        name: fosu-dashboard
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 600

    - name: Remove rendered temporary manifests
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: absent
      loop: "{{ rendered_manifests.results }}"

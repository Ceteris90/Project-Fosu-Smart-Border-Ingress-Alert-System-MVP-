---
# Regenerate and privately route the kubeconfig at {{ kubeconfig_path }} from
# Terraform state. Shared by site.yml and monitoring.yml so either entry point
# works on a fresh machine: the kubeconfig lives under /tmp and is wiped on
# reboot, and only this flow recreates it.
#
# Requires the play to define `terraform_dir` and `kubeconfig_path`.

- name: Require Azure CLI, kubectl, and kubelogin
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - az --version
    - kubectl version --client
    - kubelogin --version

- name: Ensure the Terraform working directory is initialized
  ansible.builtin.command:
    cmd: terraform init -input=false -no-color
    chdir: "{{ terraform_dir }}"
    creates: "{{ terraform_dir }}/.terraform"
  changed_when: false

- name: Read Terraform outputs for the kubeconfig bootstrap
  ansible.builtin.command:
    argv:
      - terraform
      - output
      - -json
    chdir: "{{ terraform_dir }}"
  register: kubeconfig_terraform_output
  changed_when: false
  no_log: true

- name: Resolve AKS identifiers from Terraform outputs
  ansible.builtin.set_fact:
    azure_resource_group: "{{ (kubeconfig_terraform_output.stdout | from_json).resource_group_name.value }}"
    aks_cluster_name: "{{ (kubeconfig_terraform_output.stdout | from_json).aks_cluster_name.value }}"

- name: Require the AKS Terraform outputs
  ansible.builtin.assert:
    that:
      - azure_resource_group | length > 0
      - aks_cluster_name | length > 0
    fail_msg: >-
      Terraform has no resource_group_name / aks_cluster_name outputs yet. Run
      'scripts/deploy.sh infra' first.

- name: Read private AKS endpoint metadata
  ansible.builtin.command:
    argv:
      - az
      - aks
      - show
      - --resource-group
      - "{{ azure_resource_group }}"
      - --name
      - "{{ aks_cluster_name }}"
      - --query
      - "{node_resource_group:nodeResourceGroup,private_fqdn:privateFqdn}"
      - --output
      - json
  register: aks_endpoint_metadata
  changed_when: false

- name: Set private AKS endpoint variables
  ansible.builtin.set_fact:
    aks_node_resource_group: "{{ (aks_endpoint_metadata.stdout | from_json).node_resource_group }}"
    aks_private_fqdn: "{{ (aks_endpoint_metadata.stdout | from_json).private_fqdn }}"
    aks_private_record_name: "{{ ((aks_endpoint_metadata.stdout | from_json).private_fqdn).split('.')[0] }}"
    aks_private_zone_name: "{{ ((aks_endpoint_metadata.stdout | from_json).private_fqdn).split('.')[1:] | join('.') }}"

- name: Resolve private AKS API address from Azure DNS
  ansible.builtin.command:
    argv:
      - az
      - network
      - private-dns
      - record-set
      - a
      - show
      - --resource-group
      - "{{ aks_node_resource_group }}"
      - --zone-name
      - "{{ aks_private_zone_name }}"
      - --name
      - "{{ aks_private_record_name }}"
      - --query
      - "aRecords[0].ipv4Address"
      - --output
      - tsv
  register: aks_private_ip
  changed_when: false

- name: Check route to private AKS API
  ansible.builtin.command:
    argv:
      - ip
      - route
      - get
      - "{{ aks_private_ip.stdout | trim }}"
  register: aks_private_route
  changed_when: false

- name: Require private AKS traffic to use the VPN tunnel
  ansible.builtin.assert:
    that:
      - aks_private_route.stdout is regex(' dev (tun|tap)[^ ]* ')
    fail_msg: >-
      Private AKS traffic is not using a VPN tunnel: {{ aks_private_route.stdout | trim }}.
      Start OpenVPN and wait for "Initialization Sequence Completed" before running Ansible.

- name: Check private AKS TCP connectivity
  ansible.builtin.wait_for:
    host: "{{ aks_private_ip.stdout | trim }}"
    port: 443
    connect_timeout: 5
    timeout: 15
    state: started
    msg: >-
      The VPN route exists, but the private AKS API is not reachable on TCP 443.
      Refresh the Azure VPN profile and reconnect before retrying Ansible.

- name: Get private AKS credentials
  ansible.builtin.command:
    argv:
      - az
      - aks
      - get-credentials
      - --resource-group
      - "{{ azure_resource_group }}"
      - --name
      - "{{ aks_cluster_name }}"
      - --file
      - "{{ kubeconfig_path }}"
      - --overwrite-existing
  changed_when: true
  no_log: true

- name: Configure kubeconfig to use the existing Azure CLI login
  ansible.builtin.command:
    argv:
      - kubelogin
      - convert-kubeconfig
      - -l
      - azurecli
      - --kubeconfig
      - "{{ kubeconfig_path }}"
  changed_when: true
  no_log: true

- name: Configure kubeconfig for private API routing
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - set-cluster
      - "{{ aks_cluster_name }}"
      - "--server=https://{{ aks_private_ip.stdout | trim }}:443"
      - "--tls-server-name={{ aks_private_fqdn }}"
  changed_when: true

- name: Check private AKS API connectivity
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - get
      - namespace
  changed_when: false

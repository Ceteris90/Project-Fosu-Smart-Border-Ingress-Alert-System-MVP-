# grafana/loki in SingleBinary mode, chunks in Azure Blob via Workload Identity.
# This is an Ansible template: the loki_container / loki_storage_account /
# loki_identity_client_id placeholders below are filled from Terraform outputs
# by monitoring.yml before helm upgrade.

fullnameOverride: loki
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  podLabels:
    azure.workload.identity/use: "true"
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: azure
    # The chart derives the Azure `container_name` from bucketNames.chunks; an
    # explicit `containerName` here is passed through verbatim and rejected by
    # Loki as an unknown field (azure.BlobStorageConfig wants container_name).
    bucketNames:
      chunks: "{{ loki_container }}"
      ruler: "{{ loki_container }}"
      admin: "{{ loki_container }}"
    azure:
      accountName: "{{ loki_storage_account }}"
      useFederatedToken: true
  limits_config:
    retention_period: 720h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_series: 10000
    volume_enabled: true
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: azure
  pattern_ingester:
    enabled: false
  querier:
    max_concurrent: 2

serviceAccount:
  create: true
  name: loki
  annotations:
    azure.workload.identity/client-id: "{{ loki_identity_client_id }}"

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 640Mi
  persistence:
    enabled: true
    storageClass: managed-csi
    size: 10Gi

# SingleBinary mode: keep the scale-out deployments at zero.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Memcached tiers default to multi-GB requests; not viable on B2s.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

gateway:
  enabled: false

monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: true
